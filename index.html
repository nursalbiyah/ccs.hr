<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CCS</title>
<script>
  // วางลิงก์เว็บแอปที่ลงท้ายด้วย /exec ระหว่างเครื่องหมายคำพูด (บรรทัดที่ 9 เท่านั้นที่ต้องแก้)
var APP_URL = "https://script.google.com/macros/s/AKfycbyRh9H_TU2KhwITtfr6D3K-ekO3pr9p36LDPZwU0i2CGrpNfeVmO5vcTqIooifVgPT9hA/exec";
  var go = APP_URL + location.search + location.hash;
  var installing = /[?&]install=1/.test(location.search);
  var standalone = navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  var ok = APP_URL.indexOf("https://script.google.com/") === 0;
  // เปิดจากไอคอนบนหน้าจอ: แสดงแอปเต็มจอ (ไม่มีแถบเบราว์เซอร์) / เปิดจากลิงก์ปกติหรือสแกน QR: ส่งต่อไปที่แอป
  if (ok && !standalone && !installing) location.replace(go);
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CCS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<style>
  html,body{margin:0;height:100%;background:#fff}
  .info{min-height:100vh;display:grid;place-items:center;background:#f2f3fa;color:#101010;font:16px/1.6 system-ui,sans-serif;text-align:center;padding:16px}
  .info img{width:96px;height:96px;border-radius:22px}
  .info a{display:inline-block;margin-top:16px;padding:12px 24px;background:#1211c2;color:#fff;border-radius:10px;text-decoration:none;font-weight:600}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<script>
  if (ok && standalone) {
    var f = document.createElement("iframe");
    f.src = go; f.title = "CCS"; document.body.appendChild(f);
  } else {
    document.body.insertAdjacentHTML("beforeend",
      '<main class="info"><div><img src="icon-192.png" alt=""><h1>CCS</h1>' +
      '<p>ตอนนี้กดปุ่มแชร์ แล้วเลือก "เพิ่มไปยังหน้าจอโฮม" ได้เลย</p>' +
      '<a href="' + APP_URL + '">เปิดระบบ</a></div></main>');
  }
</script>
</body>
</html>
